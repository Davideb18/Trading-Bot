services:
  freqtrade_prop:
    build:
      context: .
      dockerfile: docker/Dockerfile.prop
    image: trading-bot-prop:production
    restart: unless-stopped
    container_name: freqtrade_prop
    environment:
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${FREQTRADE_JWT_TOKEN:-supersecretjwttoken}
      - FREQTRADE__API_SERVER__PASSWORD=${FREQTRADE_PASSWORD:-ZeroBurnPassword2026!}
      - FREQTRADE__API_SERVER__WS_TOKEN=${FREQTRADE_WS_TOKEN:-supersecretwstoken}
      - FREQTRADE__EXCHANGE__KEY=${PROP_BYBIT_API_KEY:-}
      - FREQTRADE__EXCHANGE__SECRET=${PROP_BYBIT_API_SECRET:-}
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "8088:8088"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade_prop.log
      --db-url sqlite:////freqtrade/user_data/trades_prop.sqlite
      --config /freqtrade/user_data/config_prop_nfix8.json
      --strategy NostalgiaForInfinityX8_Prop

  freqtrade_prop_risk_manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.riskmanager
    container_name: freqtrade_prop_risk_manager
    restart: unless-stopped
    depends_on:
      - freqtrade_prop
    environment:
      - FREQTRADE_API_URL=http://freqtrade_prop:8088/api/v1
      - FREQTRADE_USERNAME=freqtrade
      - FREQTRADE_PASSWORD=${FREQTRADE_PASSWORD:-ZeroBurnPassword2026!}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PROP_FIRM_INITIAL_BALANCE=${PROP_FIRM_INITIAL_BALANCE:-5000}
      - GLOBAL_HARD_STOPLOSS_PERCENT=${GLOBAL_HARD_STOPLOSS_PERCENT:-0.040}
      - PROP_FIRM_MAX_LOSS_PERCENT=${PROP_FIRM_MAX_LOSS_PERCENT:-0.052}
      - CHECK_INTERVAL_SECONDS=5
    volumes:
      - "./scripts:/app/scripts:ro"
      - "./user_data:/app/user_data:rw"
    command: ["python3", "-u", "/app/scripts/llm_risk_manager_prop.py"]
