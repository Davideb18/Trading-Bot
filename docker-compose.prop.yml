services:
  freqtrade_prop:
    build:
      context: .
      dockerfile: docker/Dockerfile.prop
    image: trading-bot-prop:production
    restart: "on-failure"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/v1/ping', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      freqtrade_prop_risk_manager:
        condition: service_healthy
    user: "${PROP_UID:?Explicit non-root UID required}:${PROP_GID:?Explicit GID required}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [prop_control]
    environment:
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FREQTRADE_JWT_TOKEN:?Required}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE_PASSWORD:?Required}
      FREQTRADE__API_SERVER__WS_TOKEN: ${FREQTRADE_WS_TOKEN:?Required}
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE_USERNAME:?Required}
      FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS: 0.0.0.0
      FREQTRADE__EXCHANGE__KEY: ${PROP_BYBIT_API_KEY:?Required}
      FREQTRADE__EXCHANGE__SECRET: ${PROP_BYBIT_API_SECRET:?Required}
      PROP_BYBIT_API_KEY: ${PROP_BYBIT_API_KEY:?Required}
      PROP_BYBIT_API_SECRET: ${PROP_BYBIT_API_SECRET:?Required}
      FREQTRADE_USERNAME: ${FREQTRADE_USERNAME:?Required}
      FREQTRADE_PASSWORD: ${FREQTRADE_PASSWORD:?Required}
      FREQTRADE_JWT_TOKEN: ${FREQTRADE_JWT_TOKEN:?Required}
      FREQTRADE_WS_TOKEN: ${FREQTRADE_WS_TOKEN:?Required}
      PROP_EMERGENCY_AUTHORITY: ${PROP_EMERGENCY_AUTHORITY:?Dedicated account shared-host acknowledgement required}
      PROP_PRIVATE_DOCKER_NETWORK: dedicated-bridge
    volumes:
      - type: bind
        source: ${PROP_DATA_DIR:?Absolute shared account directory required}
        target: /freqtrade/user_data
        bind:
          create_host_path: false
    ports: ["127.0.0.1:8088:8088"]
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade_prop.log
      --db-url sqlite:////freqtrade/user_data/trades_prop.sqlite
      --config /freqtrade/user_data/config_prop_nfix8.json
      --strategy NostalgiaForInfinityX8_Prop

  freqtrade_prop_risk_manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.riskmanager-prop
    restart: "on-failure"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python3", "-c", "import json; from datetime import datetime,UTC; from pathlib import Path; s=json.loads(Path('/app/user_data/risk_manager_prop_state.json').read_text()); assert (datetime.now(UTC)-datetime.fromisoformat(s['last_updated'])).total_seconds()<=10"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    user: "${PROP_UID:?Explicit non-root UID required}:${PROP_GID:?Explicit GID required}"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [prop_control]
    environment:
      FREQTRADE_API_URL: http://freqtrade_prop:8088/api/v1
      FREQTRADE_USERNAME: ${FREQTRADE_USERNAME:?Required}
      FREQTRADE_PASSWORD: ${FREQTRADE_PASSWORD:?Required}
      FREQTRADE_JWT_TOKEN: ${FREQTRADE_JWT_TOKEN:?Required}
      FREQTRADE_WS_TOKEN: ${FREQTRADE_WS_TOKEN:?Required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PROP_TELEGRAM_BOT_TOKEN: ${PROP_TELEGRAM_BOT_TOKEN:?Required}
      PROP_TELEGRAM_CHAT_ID: ${PROP_TELEGRAM_CHAT_ID:?Required}
      PROP_INACTIVITY_KEEPALIVE: ${PROP_INACTIVITY_KEEPALIVE:-false}
      CHECK_INTERVAL_SECONDS: 5
      PYTHONPATH: /app
      PROP_BYBIT_API_KEY: ${PROP_BYBIT_API_KEY:?Required}
      PROP_BYBIT_API_SECRET: ${PROP_BYBIT_API_SECRET:?Required}
      PROP_EMERGENCY_AUTHORITY: ${PROP_EMERGENCY_AUTHORITY:?Dedicated account shared-host acknowledgement required}
      PROP_PRIVATE_DOCKER_NETWORK: dedicated-bridge
    volumes:
      - "./scripts:/app/scripts:ro"
      - "./freqtrade:/app/freqtrade:ro"
      - type: bind
        source: ${PROP_DATA_DIR:?Absolute shared account directory required}
        target: /app/user_data
        bind:
          create_host_path: false
    command: ["python3", "-u", "/app/scripts/prop_secure_start.py", "supervisor"]

networks:
  prop_control:
    driver: bridge
